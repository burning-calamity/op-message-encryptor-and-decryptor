name: OpenBoard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and OpenBoard
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Install Python project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Check Python and OpenBoard scripts
        run: ./scripts/check_all.sh --android
