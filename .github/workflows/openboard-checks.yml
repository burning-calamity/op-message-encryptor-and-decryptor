name: OpenBoard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and OpenBoard
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            tools platform-tools platforms;android-31 build-tools;31.0.0
            ndk;21.3.6528147

      - name: Install Python project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff

      - name: Check Python and OpenBoard sources
        run: bash ./scripts/check_all.sh

      - name: Build and lint OpenBoard Android app
        working-directory: openboard-encrypting
        run: bash ./gradlew --no-daemon assembleDebug lint
